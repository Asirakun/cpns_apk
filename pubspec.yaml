name: cpns_journey
description: Pendamping belajar dan perjalanan seleksi CPNS, offline terlebih dahulu.
publish_to: none
version: 1.2.3+8
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  supabase_flutter: ^2.10.0
  flutter_secure_storage: ^10.0.0
  drift: ^2.30.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  fl_chart: ^1.1.1
  intl: ^0.20.2
  uuid: ^4.5.2
  crypto: ^3.0.6
  cryptography: ^2.9.0
  http: ^1.5.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  pdf: ^3.11.3
  # image 4.11 uses an archive API absent in archive 4.0.9.
  image: 4.5.4
  cross_file: ^0.3.4+2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/papercut/
    - assets/papercut_home/
    - assets/papercut_functions/
    - assets/brand/
    - assets/intro/
    - assets/fonts/OFL.txt
  fonts:
    - family: PlusJakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
